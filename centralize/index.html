<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralizando</title>
    <style>
      #container{
        background-image: url('targ.png');
        background-color: red;
        position: relative;
        background-size: 100% 100%;
        height: 96vh;
        padding: 10px;

      }
      #conteudo{
        background-image: url('targ.png');
        position: absolute;
        background: yellow;
        background-size: 100% 100%;
        height: 200px;
        width: 400px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);


      }
    </style>
</head>
<body>
    <h1>Centralizando verticalmente a caixa</h1>
    <section id="container"> <article id="conteudo"></article></section>
   
</body>
</html>
