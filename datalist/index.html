<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datalist</title>
</head>
<body> 
    <fieldset>
        <legend>Datalist</legend>
    <form action="cadastro" method="post">
    <h1>Aqui vai as datalist</h1>
    <label for="iprof">Frofessor</label>
    <input type="text" name="prof" id="iprof" list="istprof">
    <datalist id="istprof">
        <option value="Ad">Administrador</option>
        <option value="Cont" >Contabilista</option>
        <option value="me">Mecanico</option>
    </datalist><br>
    <label for="imsg">Mensagem:</label>
    <textarea name="Mesg" id="imsg" cols="30" rows="10">
</textarea>
   
    <input type="submit" value="enviar">
    <input type="reset" value="limpar"></form>
    </fieldset>
</body>
</html>
